name: CI

# Checks that need no secrets. Nothing here calls Gemini or Qdrant or deploys.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Data, scripts and API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:validate
      - run: pnpm test:scripts
      - run: pnpm typecheck:scripts
      - name: API type-check
        run: pnpm typecheck
        working-directory: apps/api
      - name: API tests (Workers runtime)
        run: pnpm vitest run
        working-directory: apps/api

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web build
